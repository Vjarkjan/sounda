[package]
name = "sounda"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = []
nds = []

[[bin]]
name = "sounda"
path = "src/main.rs"
required-features = ["nds"]
test = false
bench = false

[[bin]]
name = "inspect-m4a"
path = "tools/inspect_m4a.rs"

[[bin]]
name = "preview"
path = "tools/preview.rs"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
